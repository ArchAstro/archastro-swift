name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# -v2: a lost macos runner never completes cancel-in-progress, so
# the previous group would queue every later SHA behind the dead job.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-v2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build + Test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Copyright headers
        run: ./scripts/check_headers.sh

      - name: Setup Node (for prism + @archastro/channel-harness)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Audit JS tooling dependencies
        run: npm audit --audit-level=moderate

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Build tests
        timeout-minutes: 20
        run: swift build --build-tests

      - name: Tests (unit + REST + channel/stream contract)
        timeout-minutes: 10
        run: swift test --skip-build --verbose
        env:
          ARCHASTRO_RUN_CHANNEL_CONTRACT_TESTS: "1"

  build-ios:
    name: Build (iOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build library for iOS
        run: >
          xcodebuild build
          -scheme archastro-swift
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
