name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No concurrency group. A lost GitHub-hosted macos runner never
# finishes cancel-in-progress, so a group queues every later SHA
# behind the dead job.

permissions:
  contents: read

jobs:
  test:
    name: Build + Test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Copyright headers
        run: ./scripts/check_headers.sh

      - name: Setup Node (for prism + @archastro/channel-harness)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Audit JS tooling dependencies
        run: npm audit --audit-level=moderate

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Build tests
        timeout-minutes: 20
        run: swift build --build-tests

      # Split so a hang names the suite. One combined `swift test` on
      # GitHub-hosted macOS sits in Tests until the runner dies; local
      # 1401-test runs finish in ~5s, so this is environment-specific.
      - name: Unit tests
        timeout-minutes: 3
        run: swift test --skip-build --filter 'ArchAstroPlatformTests[.]'

      - name: REST contract tests
        timeout-minutes: 5
        run: swift test --skip-build --filter 'ArchAstroPlatformContractTests[.]'

      - name: Channel and stream contract tests
        timeout-minutes: 5
        run: swift test --skip-build --filter 'ChannelContractTests|StreamContractTests|HarnessLifecycle'
        env:
          ARCHASTRO_RUN_CHANNEL_CONTRACT_TESTS: "1"

  build-ios:
    name: Build (iOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build library for iOS
        run: >
          xcodebuild build
          -scheme archastro-swift
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
