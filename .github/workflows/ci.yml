name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No concurrency group. A lost GitHub-hosted macos runner never
# finishes cancel-in-progress, so a group queues every later SHA
# behind the dead job.

permissions:
  contents: read

jobs:
  test:
    name: Build + Test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Copyright headers
        run: ./scripts/check_headers.sh

      - name: Setup Node (for prism + @archastro/channel-harness)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Audit JS tooling dependencies
        run: node scripts/audit-js-tooling.mjs

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Build tests
        timeout-minutes: 20
        run: swift build --build-tests

      # Split so a hang names the suite. One combined `swift test` on
      # GitHub-hosted macOS sits in Tests until the runner dies; local
      # 1401-test runs finish in ~5s, so this is environment-specific.
      - name: Unit tests
        timeout-minutes: 3
        run: swift test --skip-build --filter 'ArchAstroPlatformTests[.]'

      - name: REST contract tests
        timeout-minutes: 5
        run: |
          set -euo pipefail
          ./node_modules/.bin/prism mock specs/platform-openapi.json \
            --port 4040 --host 127.0.0.1 \
            >/tmp/prism.out 2>/tmp/prism.err &
          prism_pid=$!
          trap 'kill "$prism_pid" 2>/dev/null || true' EXIT
          prism_up() {
            # Any HTTP response means the mock is listening. GET / is not
            # in the spec, so Prism 404s; curl -f treated that as down.
            local code
            code=$(curl -sS -m 1 -o /dev/null -w '%{http_code}' http://127.0.0.1:4040/ || true)
            [[ "$code" =~ ^[1-5][0-9][0-9]$ ]]
          }
          for i in $(seq 1 60); do
            if prism_up; then
              echo "prism answering after ${i} probe(s)"
              break
            fi
            if ! kill -0 "$prism_pid" 2>/dev/null; then
              echo "prism exited before answering" >&2
              cat /tmp/prism.err >&2 || true
              exit 1
            fi
            sleep 0.5
          done
          prism_up
          echo "=== one REST ping ==="
          swift test --skip-build --filter status_ping_success
          echo "=== full REST suite ==="
          swift test --skip-build --filter 'ArchAstroPlatformContractTests[.]'

      - name: Channel and stream contract tests
        timeout-minutes: 5
        run: swift test --skip-build --filter 'ChannelContractTests|StreamContractTests|HarnessLifecycle'
        env:
          ARCHASTRO_RUN_CHANNEL_CONTRACT_TESTS: "1"

  build-ios:
    name: Build (iOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build library for iOS
        run: >
          xcodebuild build
          -scheme archastro-swift
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
